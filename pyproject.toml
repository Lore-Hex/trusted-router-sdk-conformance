[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trusted-router-sdk-conformance"
version = "0.1.0"
description = "Black-box conformance and fault-injection tests for every TrustedRouter SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Lore Hex" }]
dependencies = [
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
tr-conformance = "trusted_router_conformance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trusted_router_conformance"]

[tool.hatch.build.targets.wheel.force-include]
"drivers" = "trusted_router_conformance/_data/drivers"
"scenarios" = "trusted_router_conformance/_data/scenarios"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S603", "S607"]
